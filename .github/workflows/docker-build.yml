name: Soul Animal Service CI

on:
  push:
    branches: ["demo"]
  pull_request:
    branches: ["demo"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/demo'
        uses: docker/login-action@v3
        with:
          username: n0x41yeem
          password: ${{ secrets.DOCKER_HUB_PAT }}

      - name: Build Soul Animal service image
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          cd app
          docker build . --file Dockerfile --tag "soul-animal:${COMMIT_HASH}"

      - name: Tag and push Soul Animal service image
        if: github.event_name == 'push' && github.ref == 'refs/heads/demo'
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          APP_IMAGE_NAME="n0x41yeem/soul-animal"

          # Tag and push images
          docker tag "soul-animal:${COMMIT_HASH}" "${APP_IMAGE_NAME}:${COMMIT_HASH}"
          docker tag "soul-animal:${COMMIT_HASH}" "${APP_IMAGE_NAME}:latest"
          docker images

          docker push "${APP_IMAGE_NAME}:${COMMIT_HASH}"
          docker push "${APP_IMAGE_NAME}:latest"
